<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - CourtBooker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/password.css">
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <i class="fa-solid fa-shuttlecock"></i> CourtBooker
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#venues">Find Courts</a></li>
                <li><a href="index.html#how-it-works">How It Works</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="nav-buttons" id="nav-auth-section">
            <!-- Logged in state (Hidden by default) -->
            <div class="user-profile-dropdown" id="userProfile" style="display: none;">
                <div class="user-info" id="userDropdownBtn">
                    <img src="" alt="Avatar" id="userAvatar" class="avatar-img">
                    <span id="userNameDisplay">User Name</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fa-regular fa-user"></i> My Profile</a>
                    <a href="dashboard.html" id="dashboardLink" style="display: none;"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                    <hr>
                    <a href="#" id="btnLogout" class="text-danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Place your Navbar HTML here (Copy from index.html) -->

    <div class="profile-wrapper">
        <!-- Sidebar Navigation -->
        <div class="profile-sidebar">
            <div class="sidebar-header">
                <!-- No avatar needed here, keep it simple -->
                <h3>Account Security</h3>
            </div>
            <ul class="sidebar-menu">
                <li><a href="profile.html"><i class="fa-solid fa-user"></i> Personal Info</a></li>
                <li><a href="change_password.html" class="active"><i class="fa-solid fa-lock"></i> Change Password</a></li>
                <li><a href="#" id="btnLogoutSidebar" class="text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content: Change Password -->
        <div class="profile-content">
            <h2>Change Password</h2>
            <p style="color: #666; margin-bottom: 20px;">Ensure your account is using a long, random password to stay secure.</p>
            
            <div id="passwordStatus" class="status-msg"></div>

            <form id="passwordForm">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" minlength="6" required>
                </div>

                <div class="form-group" style="margin-bottom: 25px;">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </div>
    </div>

    <script src="js/profile.js"></script>
</body>
</html>
