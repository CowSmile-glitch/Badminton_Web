<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CourtBooker</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <i class="fa-solid fa-shuttlecock"></i> CourtBooker
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#venues">Find Courts</a></li>
                <li><a href="index.html#how-it-works">How It Works</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="nav-buttons" id="nav-auth-section">
            <!-- Default state (Not logged in) -->
            <a href="login.html" class="btn btn-outline" id="btnLogin">Log In</a>
            <a href="register.html" class="btn btn-primary" id="btnSignup">Sign Up</a>
            
            <!-- Logged in state (Hidden by default) -->
            <div class="user-profile-dropdown" id="userProfile" style="display: none;">
                <div class="user-info" id="userDropdownBtn">
                    <img src="" alt="Avatar" id="userAvatar" class="avatar-img">
                    <span id="userNameDisplay">User Name</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                
                <!-- Dropdown Menu -->
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html"><i class="fa-regular fa-user"></i> My Profile</a>
                    <a href="dashboard.html" id="dashboardLink" style="display: none;"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                    <hr>
                    <a href="#" id="btnLogout" class="text-danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Log in to manage your bookings or courts.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <p id="errorMessage" class="error-text">Invalid email or password. Please try again.</p>

            <button type="submit" class="btn-login">Log In</button>
        </form>

        <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Sign up here</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
