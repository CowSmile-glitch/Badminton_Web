<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Venue - CourtBooker</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/index.css"> 
    <link rel="stylesheet" href="css/venue.css"> 
</head>
<body>

    <!-- UNIVERSAL NAVBAR -->
    <header class="navbar scrolled" id="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <i class="fa-solid fa-shuttlecock"></i> CourtBooker
            </a>
        </div>
        <div class="nav-buttons" id="nav-auth-section">
            <a href="index.html" class="btn btn-outline">Back to Home</a>
        </div>
    </header>

    <!-- FORM SECTION -->
    <div class="venue-creation-container">
        <div class="venue-box">
            <h2><i class="fa-solid fa-building-flag"></i> Register Your Venue</h2>
            <p class="subtitle">Set up your badminton center profile to start adding courts.</p>
            
            <div id="venueStatus" style="display: none; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center;"></div>

            <form id="createVenueForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="venueName">Venue Name</label>
                    <input type="text" id="venueName" name="name" placeholder="e.g. Ninh Kieu Sport Arena" required>
                </div>

                <div class="form-group">
                    <label for="address">Full Address</label>
                    <input type="text" id="address" name="address" placeholder="e.g. 123 3/2 Street, Can Tho" required>
                </div>

                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="openingTime">Opening Time</label>
                        <input type="time" id="openingTime" name="opening_time" value="05:00" required>
                    </div>
                    <div class="form-group half-width">
                        <label for="closingTime">Closing Time</label>
                        <input type="time" id="closingTime" name="closing_time" value="22:00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="coverImage">Cover Image</label>
                    <input type="file" name="venue_image" class="form-control" accept="image/jpeg, image/png, image/jpg" required>
                    <small style="color: #6c757d; font-size: 13px;">Upload a high-quality image of your center to attract players.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="width: 100%; margin-top: 15px; font-size: 16px;">
                    Create Venue Profile
                </button>
            </form>
        </div>
    </div>

    <!-- JS Files -->
    <script src="js/index.js"></script>
    <script src="js/create_venue.js"></script>
</body>
</html>
