<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Dashboard - CourtBooker</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/index.css"> 
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <!-- UNIVERSAL NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none;">
                <img src="asset/images/logo_system.jpg" alt="CourtBooker Logo" class="navbar-logo"> 
            </a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html" class="active">Courts</a></li>
                <li><a href="venues.html">Find Courts</a></li>
                <li><a href="favorites.html">Favorites</a></li>
                
            </ul>
        </nav>
        <div class="nav-buttons" id="nav-auth-section">
            <a href="login.html" class="btn btn-outline" id="btnLogin">Log In</a>
            <a href="register.html" class="btn btn-primary" id="btnSignup">Sign Up</a>
            
            <div class="user-profile-dropdown" id="userProfile" style="display: none;">
                <div class="user-info" id="userDropdownBtn">
                    <img src="" alt="Avatar" id="userAvatar" class="avatar-img">
                    <span id="userNameDisplay">User Name</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </div>
                
                <!-- User Avatar Dropdown Menu -->
                    <div class="dropdown-menu" id="userDropdown">
                        <!-- Profile Link -->
                        <a href="profile.html" class="dropdown-item">
                            <i class="fa-regular fa-user"></i>
                            <span>My Profile</span>
                        </a>
                        
                        <!-- Vendor Center Link -->
                        <a href="my_venue.html" class="dropdown-item">
                            <i class="fa-solid fa-house-chimney"></i>
                            <span>My Center</span>
                        </a>
                        
                        <!-- Booking History Link -->
                        <a href="my_bookings.html" class="dropdown-item">
                            <i class="fa-regular fa-calendar-check"></i>
                            <span>My Bookings</span>
                        </a>
                        
                        <!-- Visual Divider -->
                        <div class="dropdown-divider"></div>
                        
                        <!-- Logout Button -->
                        <a href="../backend/logout.php" class="dropdown-item logout-btn">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                            <span>Logout</span>
                        </a>
                    </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h2><i class="fa-solid fa-clipboard-list"></i> My Courts Management</h2>
            <!-- The "Add New Court" button has been restored here. -->
            <button class="btn btn-primary" id="btnOpenAddModal">
                <i class="fa-solid fa-plus"></i> Add New Court
            </button>
        </div>

        <table id="courtsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Court Name</th>
                    <th>Price / Hour (VND)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="courtList">
                <!-- Data rendered by dashboard.js -->
            </tbody>
        </table>
    </div>

    <!-- MODAL (Hidden) -->
    <div class="modal" id="courtModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add New Court</h3>
            <!-- The enctype attribute supports uploading image files. -->
            <form id="courtForm" enctype="multipart/form-data">
                <input type="hidden" id="actionType" name="action" value="add">
                <input type="hidden" id="courtId" name="court_id" value="">
                
                <div class="form-group">
                    <label for="courtImage">Court Image</label>
                    <input type="file" id="courtImage" name="court_image" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="courtName">Court Name</label>
                    <input type="text" id="courtName" name="court_name" placeholder="e.g. VIP Court 1" required>
                </div>
                
                <div class="form-group">
                    <label for="courtPrice">Price Per Hour (VND)</label>
                    <input type="number" id="courtPrice" name="price_per_hour" placeholder="e.g. 80000" required>
                </div>
                
                <div class="form-group" id="statusGroup" style="display: none;">
                    <label for="courtStatus">Status</label>
                    <select id="courtStatus" name="status">
                        <option value="available">Available</option>
                        <option value="maintenance">Maintenance</option>
                        <option value="disabled">Disabled</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" id="btnCloseModal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Court</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Files -->
    <script src="js/index.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
